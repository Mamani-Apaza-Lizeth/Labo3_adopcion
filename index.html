<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control y Adopción de Mascotas | Universidad Salesiana de Bolivia</title>

<!-- Bootstrap 5 CSS vía CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons vía CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Supabase SDK JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    :root{
        --pastel-fondo: #acd4ec;    
        --pastel-azul: #934fb2;   
        --pastel-rosa: #ce83c3;      
        --pastel-amarillo: #b996d3;  
        --pastel-verde: #d9c6e4;     
        --pastel-lila: #f7f1f5;      
        --texto-oscuro: #0b090a;     
    }

    body{
        background-color: var(--pastel-fondo);
        color: var(--texto-oscuro);
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    .navbar-usb{
        background-color: var(--pastel-azul);
        border-bottom: 5px solid var(--pastel-amarillo);
        box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .navbar-usb .navbar-brand{
        color: var(--texto-oscuro);
        font-weight:700;
        letter-spacing:.5px;
    }

    .navbar-usb .subtitulo{
        color: #b3bec0;
        font-size:.85rem;
        display:block;
        font-weight:500;
    }

    .logo-img{
        width: 55px;
        height: 55px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid #fff;
        margin-right: 12px;
    }

    .btn-usb-rojo{
        background-color: var(--pastel-rosa);
        border-color: var(--pastel-rosa);
        color: var(--texto-oscuro);
        font-weight: 600;
    }
    .btn-usb-rojo:hover{ background-color:#e8b0b0; border-color:#e8b0b0; color: var(--texto-oscuro); }

    .btn-usb-azul{
        background-color: var(--pastel-azul);
        border-color: var(--pastel-azul);
        color: var(--texto-oscuro);
        font-weight: 600;
    }
    .btn-usb-azul:hover{ background-color:#92b6bb; border-color:#92b6bb; color: var(--texto-oscuro); }

    .btn-usb-amarillo{
        background-color: var(--pastel-amarillo);
        border-color: var(--pastel-amarillo);
        color: var(--texto-oscuro);
        font-weight: 600;
    }
    .btn-usb-amarillo:hover{ background-color:#ebd7a0; border-color:#ebd7a0; }

    /* ---------- Tarjetas de mascotas ---------- */
    .card-mascota{
        border: none;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 12px rgba(0,0,0,.04);
        transition: transform .15s ease, box-shadow .15s ease;
        height: 100%;
        background-color: #ffffff;
    }
    .card-mascota:hover{
        transform: translateY(-4px);
        box-shadow: 0 8px 18px rgba(0,0,0,.08);
    }
    .card-mascota .card-img-top{
        height: 220px;
        object-fit: cover;
        background-color: #d41d1d;
    }
    .card-mascota .card-header-especie{
        position: absolute;
        top: 10px;
        right: 10px;
        color: var(--texto-oscuro);
        font-weight: 600;
    }

    .badge-disponible{ background-color: var(--pastel-verde); }
    .badge-adoptado{ background-color: var(--pastel-rosa); }

    .franja-titulo{
        background-color: var(--pastel-lila);
        color: var(--texto-oscuro);
        border-left: 6px solid var(--pastel-amarillo);
        padding: .6rem 1rem;
        border-radius: 8px;
        margin-bottom: 1.2rem;
    }

    /* ---------- Sección de formulario ---------- */
    .panel-formulario{
        background: #ffffff;
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 4px 12px rgba(0,0,0,.04);
        border-top: 5px solid var(--pastel-rosa);
    }

    .preview-foto{
        width: 100%;
        max-height: 180px;
        object-fit: cover;
        border-radius: 10px;
        border: 2px dashed var(--pastel-lila);
        display: none;
    }

    /* ---------- Modal perfil completo ---------- */
    .modal-header-usb{
        background-color: var(--pastel-azul);
        color: var(--texto-oscuro);
        border-bottom: 4px solid var(--pastel-amarillo);
    }
    .foto-modal{
        width: 100%;
        max-height: 380px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 1rem;
    }

    /* ---------- Footer institucional ---------- */
    footer.footer-usb{
        background-color: #ffffff;
        color: var(--texto-oscuro);
        border: 2px solid var(--pastel-azul);
        border-radius: 20px;
        max-width: 600px;
        margin: 3rem auto 2rem auto;
        padding: 1.2rem;
        box-shadow: 0 4px 12px rgba(0,0,0,.04);
    }
    footer.footer-usb strong{ color: #d46b6b; }

    .empty-state{
        text-align: center;
        padding: 3rem 1rem;
        color: #8c8588;
    }
</style>
</head>
<body>

<!-- ======================= CABECERA INSTITUCIONAL ======================= -->
<nav class="navbar navbar-usb py-3 mb-4">
    <div class="container d-flex align-items-center">
        <!-- Reemplaza el src con la ruta o URL de tu imagen -->
        <img src="https://img.magnific.com/vector-gratis/grupo-mascotas-sonrientes-lindas_23-2148512151.jpg?semt=ais_hybrid&w=740&q=80" alt="Logo Mascotas" class="logo-img">
        <div>
            <span class="navbar-brand mb-0 h1">Sistema de Control y Adopción de Mascotas</span>
            <span class="subtitulo">Universidad Salesiana de Bolivia — Ingeniería de Sistemas</span>
        </div>
    </div>
</nav>

<div class="container">

    <!-- ======================= MÓDULO DE REGISTRO ======================= -->
    <div class="franja-titulo">
        <h4 class="m-0"><i class="bi bi-clipboard2-plus"></i> Registro de Mascotas en Adopción</h4>
    </div>

    <div class="panel-formulario mb-5">
        <form id="formMascota" class="row g-3">
            <div class="col-md-4">
                <label class="form-label fw-bold">Nombre</label>
                <input type="text" class="form-control" id="nombre" required placeholder="Ej. Firulais">
            </div>

            <div class="col-md-4">
                <label class="form-label fw-bold">Especie</label>
                <select class="form-select" id="especie" required>
                    <option value="" selected disabled>Seleccione...</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label fw-bold">Edad (años)</label>
                <input type="number" min="0" step="1" class="form-control" id="edad" required placeholder="Ej. 2">
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Raza</label>
                <input type="text" class="form-control" id="raza" required placeholder="Ej. Criollo, Labrador, etc.">
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Estado de Salud / Vacunas</label>
                <input type="text" class="form-control" id="salud" required placeholder="Ej. Vacunas al día, esterilizado">
            </div>

            <div class="col-md-8">
                <label class="form-label fw-bold">Descripción / Historia</label>
                <textarea class="form-control" id="descripcion" rows="3" required placeholder="Cuenta brevemente la historia de la mascota..."></textarea>
            </div>

            <div class="col-md-4">
                <label class="form-label fw-bold">Fotografía</label>
                <input type="file" class="form-control" id="foto" accept="image/*">
                <img id="previewFoto" class="preview-foto mt-2" alt="Vista previa de la foto">
            </div>

            <div class="col-12 text-end">
                <button type="reset" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                </button>
                <button type="submit" id="btnGuardar" class="btn btn-usb-rojo">
                    <i class="bi bi-save"></i> Registrar Mascota
                </button>
            </div>
        </form>
    </div>

    <!-- ======================= GALERÍA DE ADOPCIÓN ======================= -->
    <div class="franja-titulo d-flex justify-content-between align-items-center flex-wrap">
        <h4 class="m-0"><i class="bi bi-images"></i> Galería de Adopción</h4>
        <div class="mt-2 mt-md-0">
            <select id="filtroEstado" class="form-select form-select-sm d-inline-block w-auto">
                <option value="Todos">Todos los estados</option>
                <option value="Disponible">Disponibles</option>
                <option value="Adoptado">Adoptados</option>
            </select>
        </div>
    </div>

    <div id="galeria" class="row g-4 mb-5">
        <!-- Tarjetas dinámicas desde Supabase -->
    </div>

</div>

<!-- ======================= MODAL DE PERFIL COMPLETO ======================= -->
<div class="modal fade" id="modalPerfil" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header modal-header-usb">
                <h5 class="modal-title"><i class="bi bi-file-earmark-person"></i> Ficha Completa de la Mascota</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger" id="btnEliminarModal">
                    <i class="bi bi-trash"></i> Eliminar registro
                </button>
                <button type="button" class="btn btn-usb-azul" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- ======================= FOOTER INSTITUCIONAL ======================= -->
<footer class="footer-usb text-center">
    <div class="container">
        <p class="mb-1">USB</p>
        <p class="mb-0">Desarrollado por: <strong>Ing. MACRO</strong></p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =========================================================================
   CONFIGURACIÓN DE SUPABASE
   ========================================================================= */
const SUPABASE_URL = "https://lpgesqdonpofoerpopkk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_utnY7OECRDGSr5bbOixnFQ__W4iaOGH";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

// Arreglo local en memoria para renderizado y filtrado
let mascotas = [];

// Elementos del DOM
const galeria = document.getElementById('galeria');
const formMascota = document.getElementById('formMascota');
const inputFoto = document.getElementById('foto');
const previewFoto = document.getElementById('previewFoto');
const filtroEstado = document.getElementById('filtroEstado');
const modalPerfilEl = document.getElementById('modalPerfil');
const modalPerfil = new bootstrap.Modal(modalPerfilEl);
const modalBody = document.getElementById('modalBody');
const btnEliminarModal = document.getElementById('btnEliminarModal');
const btnGuardar = document.getElementById('btnGuardar');

let idMascotaActiva = null;
let fotoBase64Temporal = '';

/* -------------------------------------------------------------------
   1. CARGAR DESDE SUPABASE
   ------------------------------------------------------------------- */
async function cargarMascotasSupabase() {
    galeria.innerHTML = `<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Cargando mascotas desde la base de datos...</p></div>`;
    
    try {
        const { data, error } = await supabaseClient
            .from('mascotas')
            .select('*')
            .order('id', { ascending: false });

        if (error) throw error;

        mascotas = data || [];
        renderizarGaleria();
    } catch (error) {
        console.error("Error al obtener datos de Supabase:", error);
        galeria.innerHTML = `<div class="col-12 text-center text-danger py-4"><i class="bi bi-exclamation-triangle-fill fs-2"></i><p>Error al conectar con la base de datos.</p></div>`;
    }
}

/* -------------------------------------------------------------------
   2. MANEJO DE FOTO (Base64)
   ------------------------------------------------------------------- */
inputFoto.addEventListener('change', function(evento){
    const archivo = evento.target.files[0];
    if(!archivo){
        fotoBase64Temporal = '';
        previewFoto.style.display = 'none';
        return;
    }
    const lector = new FileReader();
    lector.onload = function(e){
        fotoBase64Temporal = e.target.result;
        previewFoto.src = fotoBase64Temporal;
        previewFoto.style.display = 'block';
    };
    lector.readAsDataURL(archivo);
});

/* -------------------------------------------------------------------
   3. GUARDAR EN SUPABASE
   ------------------------------------------------------------------- */
formMascota.addEventListener('submit', async function(evento){
    evento.preventDefault();

    btnGuardar.disabled = true;
    btnGuardar.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Guardando...`;

    const nuevaMascota = {
        id: Date.now(),
        nombre: document.getElementById('nombre').value.trim(),
        especie: document.getElementById('especie').value,
        edad: Number(document.getElementById('edad').value),
        raza: document.getElementById('raza').value.trim(),
        salud: document.getElementById('salud').value.trim(),
        descripcion: document.getElementById('descripcion').value.trim(),
        foto: fotoBase64Temporal || generarFotoPlaceholder(),
        estado: 'Disponible'
    };

    try {
        const { error } = await supabaseClient
            .from('mascotas')
            .insert([nuevaMascota]);

        if (error) throw error;

        formMascota.reset();
        previewFoto.style.display = 'none';
        fotoBase64Temporal = '';
        
        await cargarMascotasSupabase();
    } catch (error) {
        console.error("Error guardando mascota:", error);
        alert("Ocurrió un error al guardar en la base de datos.");
    } finally {
        btnGuardar.disabled = false;
        btnGuardar.innerHTML = `<i class="bi bi-save"></i> Registrar Mascota`;
    }
});

function generarFotoPlaceholder(){
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220"><rect width="100%" height="100%" fill="#f0f0f0"/><text x="50%" y="50%" font-size="16" fill="#8c8588" text-anchor="middle" dy=".3em" font-family="Arial">Sin fotografía</text></svg>`;
    return 'data:image/svg+xml;base64,' + btoa(svg);
}

/* -------------------------------------------------------------------
   4. RENDERIZADO DE LA GALERÍA
   ------------------------------------------------------------------- */
function renderizarGaleria(){
    const filtro = filtroEstado.value;
    const listaFiltrada = mascotas.filter(m => filtro === 'Todos' || m.estado === filtro);

    galeria.innerHTML = '';

    if(listaFiltrada.length === 0){
        galeria.innerHTML = `
            <div class="col-12">
                <div class="empty-state">
                    <i class="bi bi-emoji-frown" style="font-size:2.5rem;"></i>
                    <p class="mt-2">No hay mascotas registradas para este filtro todavía.</p>
                </div>
            </div>`;
        return;
    }

    listaFiltrada.forEach(mascota => {
        const esDisponible = mascota.estado === 'Disponible';
        const claseBadge = esDisponible ? 'badge-disponible' : 'badge-adoptado';
        const textoBtnEstado = esDisponible
            ? '<i class="bi bi-heart-fill"></i> Marcar Adoptado'
            : '<i class="bi bi-arrow-counterclockwise"></i> Marcar Disponible';
        const claseBtnEstado = esDisponible ? 'btn-usb-rojo' : 'btn-usb-azul';

        const columna = document.createElement('div');
        columna.className = 'col-sm-6 col-lg-4';

        columna.innerHTML = `
            <div class="card card-mascota position-relative">
                <span class="badge ${claseBadge} card-header-especie">${mascota.estado}</span>
                <img src="${mascota.foto}" class="card-img-top" alt="Foto de ${mascota.nombre}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title mb-1">${mascota.nombre}</h5>
                    <p class="card-text text-muted mb-2">
                        <i class="bi bi-tag-fill"></i> ${mascota.especie} &nbsp;|&nbsp;
                        <i class="bi bi-calendar3"></i> ${mascota.edad} años
                    </p>
                    <div class="mt-auto d-grid gap-2">
                        <button class="btn btn-usb-amarillo btn-sm btn-ver-perfil" data-id="${mascota.id}">
                            <i class="bi bi-person-badge"></i> Ver Perfil Completo
                        </button>
                        <button class="btn ${claseBtnEstado} btn-sm btn-toggle-estado" data-id="${mascota.id}">
                            ${textoBtnEstado}
                        </button>
                    </div>
                </div>
            </div>`;

        galeria.appendChild(columna);
    });

    enlazarEventosDeTarjetas();
}

function enlazarEventosDeTarjetas(){
    document.querySelectorAll('.btn-ver-perfil').forEach(boton => {
        boton.addEventListener('click', () => abrirPerfilCompleto(Number(boton.dataset.id)));
    });

    document.querySelectorAll('.btn-toggle-estado').forEach(boton => {
        boton.addEventListener('click', () => alternarEstadoMascota(Number(boton.dataset.id)));
    });
}

/* -------------------------------------------------------------------
   5. CAMBIO DE ESTADO EN SUPABASE
   ------------------------------------------------------------------- */
async function alternarEstadoMascota(id){
    const mascota = mascotas.find(m => m.id === id);
    if(!mascota) return;

    const nuevoEstado = mascota.estado === 'Disponible' ? 'Adoptado' : 'Disponible';

    try {
        const { error } = await supabaseClient
            .from('mascotas')
            .update({ estado: nuevoEstado })
            .eq('id', id);

        if (error) throw error;

        await cargarMascotasSupabase();
    } catch (error) {
        console.error("Error al actualizar estado:", error);
        alert("No se pudo cambiar el estado en la base de datos.");
    }
}

/* -------------------------------------------------------------------
   6. MODAL PERFIL COMPLETO Y ELIMINACIÓN EN SUPABASE
   ------------------------------------------------------------------- */
function abrirPerfilCompleto(id){
    const mascota = mascotas.find(m => m.id === id);
    if(!mascota) return;

    idMascotaActiva = id;
    const claseBadge = mascota.estado === 'Disponible' ? 'badge-disponible' : 'badge-adoptado';

    modalBody.innerHTML = `
        <img src="${mascota.foto}" class="foto-modal" alt="Foto completa de ${mascota.nombre}">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">${mascota.nombre}</h3>
            <span class="badge ${claseBadge} fs-6">${mascota.estado}</span>
        </div>
        <table class="table table-bordered">
            <tbody>
                <tr><th style="width:35%">Especie</th><td>${mascota.especie}</td></tr>
                <tr><th>Raza</th><td>${mascota.raza}</td></tr>
                <tr><th>Edad</th><td>${mascota.edad} años</td></tr>
                <tr><th>Ficha médica / Vacunas</th><td>${mascota.salud}</td></tr>
                <tr><th>Historia</th><td>${mascota.descripcion}</td></tr>
            </tbody>
        </table>
    `;

    modalPerfil.show();
}

btnEliminarModal.addEventListener('click', async function(){
    if(idMascotaActiva === null) return;

    const confirmar = confirm('¿Está seguro de eliminar este registro? Esta acción no se puede deshacer.');
    if(!confirmar) return;

    try {
        const { error } = await supabaseClient
            .from('mascotas')
            .delete()
            .eq('id', idMascotaActiva);

        if (error) throw error;

        modalPerfil.hide();
        idMascotaActiva = null;
        await cargarMascotasSupabase();
    } catch (error) {
        console.error("Error eliminando registro:", error);
        alert("No se pudo eliminar el registro de Supabase.");
    }
});

/* -------------------------------------------------------------------
   7. EVENTOS E INICIALIZACIÓN
   ------------------------------------------------------------------- */
filtroEstado.addEventListener('change', renderizarGaleria);

// Cargar los datos desde Supabase al iniciar la página
cargarMascotasSupabase();
</script>

</body>
</html>
